name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build (${{ matrix.platform }}-${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: darwin
            arch: arm64
            build-command: bash apps/electron/scripts/build-dmg.sh arm64
          - os: macos-latest
            platform: darwin
            arch: x64
            build-command: bash apps/electron/scripts/build-dmg.sh x64
          - os: ubuntu-latest
            platform: linux
            arch: x64
            build-command: bash apps/electron/scripts/build-linux.sh x64
          - os: windows-latest
            platform: win32
            arch: x64
            build-command: pwsh apps/electron/scripts/build-win.ps1

    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION=$(node -p "require('./apps/electron/package.json').version")
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION"

      - name: Build Electron package
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          SLACK_OAUTH_CLIENT_ID: ${{ secrets.SLACK_OAUTH_CLIENT_ID }}
          SLACK_OAUTH_CLIENT_SECRET: ${{ secrets.SLACK_OAUTH_CLIENT_SECRET }}
          MICROSOFT_OAUTH_CLIENT_ID: ${{ secrets.MICROSOFT_OAUTH_CLIENT_ID }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: ${{ matrix.build-command }}

      - name: Stage release artifacts
        id: artifacts
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          RELEASE_DIR=".build/release"
          mkdir -p "$RELEASE_DIR"

          case "${{ matrix.platform }}" in
            darwin)
              PLATFORM_TAG="mac"
              cp "apps/electron/release/Craft-Agents-${{ matrix.arch }}.dmg" \
                "$RELEASE_DIR/Craft-Agents-${VERSION}-${PLATFORM_TAG}-${{ matrix.arch }}.dmg"
              if [ -f "apps/electron/release/Craft-Agents-${{ matrix.arch }}.zip" ]; then
                cp "apps/electron/release/Craft-Agents-${{ matrix.arch }}.zip" \
                  "$RELEASE_DIR/Craft-Agents-${VERSION}-${PLATFORM_TAG}-${{ matrix.arch }}.zip"
              fi
              ;;
            linux)
              cp "apps/electron/release/Craft-Agents-${{ matrix.arch }}.AppImage" \
                "$RELEASE_DIR/Craft-Agents-${VERSION}-linux-${{ matrix.arch }}.AppImage"
              ;;
            win32)
              cp "apps/electron/release/Craft-Agents-${{ matrix.arch }}.exe" \
                "$RELEASE_DIR/Craft-Agents-${VERSION}-win-${{ matrix.arch }}.exe"
              ;;
          esac

          echo "Staged artifacts:"
          ls -lh "$RELEASE_DIR"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: craft-agents-${{ matrix.platform }}-${{ matrix.arch }}
          path: .build/release/*
          retention-days: 7
          if-no-files-found: error

  release:
    name: publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List release files
        run: ls -lh dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
